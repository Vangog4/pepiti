[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC"]
ignore = ["E501", "E712", "B008", "N805", "UP042", "ASYNC230", "ASYNC240"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
