name: pepito-bot

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: pepito
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: pepito_db
    volumes:
      - pepito_pgdata:/var/lib/postgresql/data
    networks:
      - pepito_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pepito"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: ["sh","-c","exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
    volumes:
      - pepito_redisdata:/data
    networks:
      - pepito_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    container_name: pepito-api
    build: .
    restart: always
    environment:
      - PEPITO_ROLE=api
    env_file:
      - .env
    networks:
      - pepito_net
      - npm_network
    depends_on:
      - db
      - redis

  bot:
    container_name: pepito-bot
    build: .
    restart: always
    environment:
      - PEPITO_ROLE=bot
    env_file:
      - .env
    networks:
      - pepito_net
    depends_on:
      - db
      - redis

volumes:
  pepito_pgdata:
  pepito_redisdata:

networks:
  pepito_net:
    driver: bridge
  npm_network:
    external: true
