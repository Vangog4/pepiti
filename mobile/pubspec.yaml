name: pepito_mobile
description: "Pepito — AI-кинолог и забота о собаке. Мобильное приложение для iOS и Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Network & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0

  # Local Storage & Offline-First
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Audio & Cynologist Tools
  audioplayers: ^6.0.0

  # Notifications
  flutter_local_notifications: ^17.1.2

  # UI, Icons, Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # Media & Hardware
  image_picker: ^1.1.2
  record: ^5.2.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
    - assets/icons/
    - assets/lottie/
